apiVersion: mxl.media.fn/v1alpha1
kind: MxlMediaFunctionParameters
metadata:
  name: writer-2ch-float32-48kHz
  label:
    app: media-processing-audio
    function: audio-writer
  namespace: media
spec:
  role: audio-writer
  flow:
    label: "studio-cam-1"

  # Media input specifications
  inputs:
    - primary-feed:
      format:
        audio:
          media_type: audio/float32
          sample_rate: 48000
          channel_count: 2

    - secondary-feed:
      format:
        audio:
          media_type: audio/float32
          sample_rate: 48000
          channel_count: 2


  # Media output specifications
  outputs:
    processed-output:
      format:
        audio:
          media_type: audio/float32
          sample_rate: 48000
          channel_count: 2

  args:  # All arguments that are relevant for the media function, and can be used for resources utilization should be included here.
    - media_type: "float32"
    - sample_rate: "48kHz"
    - channel_count: "2"

  # Resource requirements for the media function
  requirements:
    cpu:
      cpu: "200m"           # Millicores (m): A fractional part of a core. 1 CPU is equal to 1000m. 500m: Half a core (0.5 CPU).100m: One-tenth of a core (0.1 CPU
      features:
        - null

    memory:
      - type: ram
        size: "4Gi"         # Requests and limits in units as expressed in Kubernetes (e.g., Mi, Gi)
        throughput:
          read: "400MBi"
          write: "400MBi"
          total: "800MBi"   # Total memory bandwidth required (if applicable)

    network:
      # audio/float32 @ 48kHz, 2ch
      # media_bytes_per_second = sample_rate * channel_count * bytes_per_sample
      #                        = 48000 * 2 * 4 = 384,000 B/s
      # Assumed packetization: ptime = 10ms
      # packets_per_second = ceil(bytes_per_packet / (mtu - 44)) * (1 / ptime)
      # wire_bytes_per_second = media_bytes_per_second + packets_per_second * 82
      # Using mtu = 1400 => wire_bytes_per_second = 408,600 B/s (~0.41MB/s)
      inputs:
        primary-feed:
          transport:
            selected: "RDMA"       # Possible alternatives: EFA, TCP
          bandwidth: "0.41MB/s"    # One audio input stream on wire (with overhead)
        secondary-feed:
          transport:
            selected: "RDMA"       # Possible alternatives: EFA, TCP
          bandwidth: "0.41MB/s"    # One audio input stream on wire (with overhead)
      outputs:
        processed-output:
          transport:
            selected: "RDMA"       # Possible alternatives: EFA, TCP
          bandwidth: "0.41MB/s"    # One processed audio output stream on wire (with overhead)


  # host platform capabilities
    host_capabilities:
      cpu:
        numa_nodes: 2
        number_of_cores: 16
        base_frequency: "2.8GHz"
        generation: "Emerald Rapids"  # CPU microarchitecture generation (e.g., Skylake, Ice Lake, etc.)
        # Selected CPU features discovered via NFD or cpuid
        features:
          - AVX512F
          - AVX512DQ
          - SGX

      network:
        - name: eth0
          bandwidth:
            input: 12.5GB/S
            output: 12.5GB/S
          features:
            - jumbo_frames
            - rdma

      gpu:
        - name: gpu_0
          generation: Ampere
          memory: 16Gi
          compute_units: 1000m # some arbitrary unit of compute capability
          capabilities: # driver-specific GPU features (e.g., CUDA compute capability, or a custom set of flags)
            - tensor_operations
            - high_precision_compute

      memory:
        - node: 0
          type: ram
          generation: DDR5
          size: 128Gi
          throughput:
            total: 125Gi
        - node: 1
          type: ram
          generation: DDR5
          size: 128Gi
          throughput:
            total: 125Gi

      storage:
        - name: nvme_0
          type: nvme # or nvme, ssd, hdd, spinning_disk, etc.
          throughput:
            read: 2000M
            write: 1800M
