apiVersion: mxl.media.fn/v1alpha1
kind: MxlMediaFunctionParameters
metadata:
  name: writer-anc-smpte291
  label:
    app: media-processing-anc
    function: anc-writer
  namespace: media
spec:
  role: anc-writer
  flow:
    label: "studio-anc-1"


  # Media input specifications
  inputs:
    - ancillary:
      format:
        data:
          media_type: video/smpte291
          grain_rate: "60"

  # Media output specifications
  outputs:
    ancillary:
      format:
        data:
          media_type: video/smpte291
          grain_rate: "60"

  args:  # All arguments that are relevant for the media function, and can be used for resources utilization should be included here.
    - media_type: "smpte291"
    - grain_rate: "60"

  # Resource requirements for the media function
  requirements:
    cpu:
      cpu: "200m"               # Millicores (m): A fractional part of a core. 1 CPU is equal to 1000m. 500m: Half a core (0.5 CPU).100m: One-tenth of a core (0.1 CPU
      features:
        - null

    memory:
      - type: ram
        size: "4Gi"             # Requests and limits in units as expressed in Kubernetes (e.g., Mi, Gi)
        throughput:
          read: "200MBi"
          write: "200MBi"
          total: "400MBi"       # Total memory bandwidth required (if applicable)

    network:
      # video/smpte291 @ grain_rate 60
      # MXL data payload size for smpte291 is fixed at 4096 bytes per grain.
      # media_bytes_per_second = 4096 * 60 = 245,760 B/s
      # packets_per_second = ceil(4096 / (mtu - 44)) * 60
      # wire_bytes_per_second = media_bytes_per_second + packets_per_second * 82
      # Using mtu = 1400 => wire_bytes_per_second = 265,440 B/s (~0.27MB/s)
      inputs:
        ancillary:
          transport:
            selected: "RDMA"      # Possible alternatives: EFA, TCP
          bandwidth: "0.27MB/s"   # One ancillary input stream on wire (with overhead)
      outputs:
        ancillary:
          transport:
            selected: "RDMA"      # Possible alternatives: EFA, TCP
          bandwidth: "0.27MB/s"   # One ancillary output stream on wire (with overhead)

  # host platform capabilities
  reference_platform:
    host_capabilities:
      cpu:
        numa_nodes: 2
        number_of_cores: 16
        base_frequency: "2.8GHz"
        generation: "Emerald Rapids"  # CPU microarchitecture generation (e.g., Skylake, Ice Lake, etc.)
        # Selected CPU features discovered via NFD or cpuid
        features:
          - AVX512F
          - AVX512DQ
          - SGX

      network:
        - name: eth0
          bandwidth:
            input: 12.5GB/s
            output: 12.5GB/s
          features:
            - jumbo_frames
            - rdma

      gpu:
        - name: gpu_0
          generation: Ampere
          memory: 16Gi
          compute_units: 1000m # some arbitrary unit of compute capability
          capabilities: # driver-specific GPU features (e.g., CUDA compute capability, or a custom set of flags)
            - tensor_operations
            - high_precision_compute

      memory:
        - node: 0
          type: ram
          generation: DDR5
          size: 128Gi
          throughput:
            total: 125Gi
        - node: 1
          type: ram
          generation: DDR5
          size: 128Gi
          throughput:
            total: 125Gi

      storage:
        - name: nvme_0
          type: nvme # or nvme, ssd, hdd, spinning_disk, etc.
          throughput:
            read: 2000M
            write: 1800M
